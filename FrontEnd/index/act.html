<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Actividades</title>

    <link rel="stylesheet" href="../styles/actstyle.css">
</head>
<body>
    <div class="contenedor">
        <h1>Mis Actividades</h1>

        <!-- Formulario para agregar una nueva actividad -->
        <form id="formulario-actividad">
            <input type="text" id="nombre" placeholder="Nombre de la actividad" required>
            <input type="text" id="descripcion" placeholder="Descripción breve" required>
            <select id="estado">
                <option value="Pendiente">Pendiente</option>
                <option value="En Proceso">En Proceso</option>
                <option value="Completada">Completada</option>
            </select>
            <button type="submit">Guardar Actividad</button>
        </form>

        <!-- Aquí aparecerán las tarjetas de las actividades generadas por JS -->
        <div id="lista-actividades"></div>
    </div>

    <!-- Conectamos el JavaScript saliendo de index y entrando a scripts -->
    <script src="../scripts/actscript.js"></script>
</body>
</html>
